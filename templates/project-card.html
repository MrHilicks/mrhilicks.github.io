<article class="project-card ${modifier}">
  <a class="project-image" href="${href}" tabindex="-1" aria-hidden="true">${image}<span class="project-badge">${badge}</span><span class="project-image-arrow" aria-hidden="true">${arrow}</span></a>
  <div class="project-content"><p class="eyebrow"><span>${number}</span> / ${category}</p><h3><a href="${href}">${title}</a></h3><p class="project-summary">${summary}</p>${tags}${metric}<a class="text-link" href="${href}">${label}${arrow}</a></div>
</article>
