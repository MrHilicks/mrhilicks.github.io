<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="container contact-inner">
    <div><p class="eyebrow">${eyebrow}</p><h2 id="contact-title">${title}</h2></div>
    <div class="contact-copy"><p>${text}</p><div class="contact-buttons"><button class="button button--light" type="button" data-open-brief hidden>${cta}${arrow}</button>${email}${telegram}</div><div class="contact-details">${details}</div><p class="contact-note">${note}</p></div>
  </div>
</section>
