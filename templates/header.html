<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="${home}" aria-label="${name}">${logo}<span>${name}<small>${brand_line}</small></span></a>
    <nav class="main-nav" id="main-nav" aria-label="${nav_label}">${nav}</nav>
    <div class="header-actions">
      <div class="language-switch" aria-label="${language_label}">${language}</div>
      <a class="header-contact" href="${contact_url}">${contact}${arrow}</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" hidden><span>${menu}</span><span class="menu-lines" aria-hidden="true"></span></button>
    </div>
  </div>
</header>
