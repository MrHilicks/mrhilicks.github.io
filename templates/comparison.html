<section class="comparison-section container" aria-labelledby="comparison-title">
  <div class="comparison-copy"><p class="eyebrow">RGB / CLASS MAP</p><h2 id="comparison-title">${title}</h2><p>${intro}</p><p class="small muted">${note}</p></div>
  <div class="comparison-demo" data-comparison><div class="comparison-stage" style="--split: 50%"><div class="comparison-after">${after}</div><div class="comparison-before">${before}</div><span class="comparison-line" aria-hidden="true"><span>↔</span></span></div><div class="comparison-labels"><span>${before_label}</span><span>${after_label}</span></div><div class="comparison-controls" data-comparison-controls hidden><label class="sr-only" for="comparison-range">${control}</label><input type="range" id="comparison-range" min="0" max="100" value="50" data-comparison-range></div></div>
</section>
